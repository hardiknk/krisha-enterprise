<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 325" width="100%" height="100%">
  <defs>
    <!-- Dark Navy -->
    <linearGradient id="navySign" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071530" />
      <stop offset="100%" stop-color="#0C1D3B" />
    </linearGradient>

    <!-- Vibrant Red -->
    <linearGradient id="redSign" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E52535" />
      <stop offset="100%" stop-color="#C81E2E" />
    </linearGradient>

    <!-- Clip path for the central white arched card -->
    <clipPath id="archClip">
      <path d="M 0,0 L 700,0 L 700,325 L 0,325 Z" />
    </clipPath>
  </defs>

  <!-- Background White Panel with Subtle Border -->
  <rect width="700" height="325" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Top Navy Arch Corners -->
  <!-- Left Corner -->
  <path d="M 0,0 L 230,0 C 130,5 45,55 0,135 Z" fill="#0C1D3B" />
  <!-- Right Corner -->
  <path d="M 700,0 L 470,0 C 570,5 655,55 700,135 Z" fill="#0C1D3B" />

  <!-- Top Arched Red Stroke Ribbon -->
  <path d="M 0,140 C 50,55 140,5 350,5 C 560,5 650,55 700,140" 
        fill="none" 
        stroke="url(#redSign)" 
        stroke-width="8" 
        stroke-linecap="round" />

  <!-- Top Arched Navy Accent Line -->
  <path d="M 15,142 C 60,65 150,18 350,18 C 550,18 640,65 685,142" 
        fill="none" 
        stroke="#0C1D3B" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Sub-header Tagline with Side Dashes -->
  <g transform="translate(350, 48)">
    <!-- Left Accent Dash -->
    <path d="M -240,-4 L -180,-4" stroke="#0C1D3B" stroke-width="3" stroke-linecap="round" />
    <!-- Center Tagline -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="19" 
          fill="#0C1D3B" 
          text-anchor="middle" 
          letter-spacing="2.8">
      FAST <tspan fill="#E52535" dx="6" dy="0">•</tspan><tspan fill="#0C1D3B" dx="6">SECURE</tspan> <tspan fill="#E52535" dx="6">•</tspan><tspan fill="#0C1D3B" dx="6">TRUSTED SERVICE</tspan>
    </text>
    <!-- Right Accent Dash -->
    <path d="M 180,-4 L 240,-4" stroke="#0C1D3B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Main Wordmark 1: KRISHA -->
  <text x="350" y="196" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="950" 
        font-size="142" 
        fill="#0C1D3B" 
        text-anchor="middle" 
        letter-spacing="2">
    KRISHA
  </text>

  <!-- Main Wordmark 2: ENTERPRISES -->
  <text x="350" y="292" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="950" 
        font-size="94" 
        fill="url(#redSign)" 
        text-anchor="middle" 
        letter-spacing="4">
    ENTERPRISES
  </text>

  <!-- Bottom Arch Baseline Trim -->
  <path d="M 10,324 Q 350,296 690,324" 
        fill="none" 
        stroke="#0C1D3B" 
        stroke-width="5" />
</svg>
