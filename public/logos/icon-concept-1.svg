<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradIcon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A" />
      <stop offset="100%" stop-color="#0A1832" />
    </linearGradient>

    <linearGradient id="roseGradIcon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <linearGradient id="goldGradIcon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="glowIcon1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradIcon1)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Ambient light -->
  <circle cx="256" cy="256" r="180" fill="#E11D48" opacity="0.15" filter="url(#glowIcon1)" />
  <circle cx="290" cy="200" r="140" fill="#F59E0B" opacity="0.12" filter="url(#glowIcon1)" />

  <!-- Center Quantum Hex-K -->
  <g transform="translate(106, 96) scale(2.0)">
    <!-- Outer Shield Hexagon Ring -->
    <polygon points="75,5 140,42 140,118 75,155 10,118 10,42" 
             fill="#08142B" 
             stroke="url(#goldGradIcon1)" 
             stroke-width="4" 
             stroke-linejoin="round" />

    <!-- Inner Inset Line -->
    <polygon points="75,16 130,48 130,112 75,144 20,112 20,48" 
             fill="none" 
             stroke="#FFFFFF" 
             stroke-opacity="0.18" 
             stroke-width="2" />

    <!-- Vertical Pillar -->
    <rect x="42" y="38" width="18" height="74" rx="5" fill="url(#roseGradIcon1)" />

    <!-- Upper Forward Arrow -->
    <path d="M 64,74 L 98,40 C 102,36 108,39 108,44 L 108,58 C 108,61 106,64 103,67 L 76,88 Z" 
          fill="url(#goldGradIcon1)" />

    <!-- Lower Swift Wing -->
    <path d="M 66,78 L 104,114 C 107,117 107,122 103,124 L 92,126 C 89,126 86,124 84,122 L 56,92 Z" 
          fill="url(#roseGradIcon1)" />

    <!-- Fusion Core Diamond -->
    <polygon points="68,75 76,67 84,75 76,83" fill="#FFFFFF" opacity="0.95" />
    <circle cx="76" cy="75" r="2.5" fill="#0A1832" />
  </g>
</svg>
