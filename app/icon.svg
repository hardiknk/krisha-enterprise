<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- White Card Squircle -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />

  <!-- Top Navy Arch Corners -->
  <path d="M 12,18 L 46,18 C 30,19 18,27 12,38 Z" fill="#0C1D3B" />
  <path d="M 116,18 L 82,18 C 98,19 110,27 116,38 Z" fill="#0C1D3B" />

  <!-- Top Arched Red Ribbon -->
  <path d="M 12,39 C 20,25 36,19 64,19 C 92,19 108,25 116,39" 
        fill="none" 
        stroke="#E52535" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- Subtitle Line: FAST • SECURE • TRUSTED -->
  <text x="64" y="27" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="4.2" 
        fill="#0C1D3B" 
        text-anchor="middle" 
        letter-spacing="0.8">
    FAST • SECURE • TRUSTED SERVICE
  </text>

  <!-- Wordmark KRISHA in Bold Navy -->
  <text x="64" y="66" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="950" 
        font-size="34" 
        fill="#0C1D3B" 
        text-anchor="middle" 
        letter-spacing="0.5">
    KRISHA
  </text>

  <!-- Wordmark ENTERPRISES in Bold Red -->
  <text x="64" y="93" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="950" 
        font-size="20" 
        fill="#E52535" 
        text-anchor="middle" 
        letter-spacing="1">
    ENTERPRISES
  </text>

  <!-- Bottom Arch Baseline Trim -->
  <path d="M 16,104 Q 64,98 112,104" 
        fill="none" 
        stroke="#0C1D3B" 
        stroke-width="2" />
</svg>
