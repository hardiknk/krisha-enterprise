<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- White Card Squircle -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Navy Corners & Arch -->
  <path d="M 0,0 L 22,0 C 12,1 4,6 0,14 Z" fill="#0C1D3B" />
  <path d="M 64,0 L 42,0 C 52,1 60,6 64,14 Z" fill="#0C1D3B" />

  <!-- Arched Red Stroke Ribbon -->
  <path d="M 0,14 C 6,6 16,1 32,1 C 48,1 58,6 64,14" 
        fill="none" 
        stroke="#E52535" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Subtitle Line -->
  <rect x="18" y="7" width="28" height="2" rx="1" fill="#0C1D3B" />

  <!-- Main Letters: K (Navy) and E (Red) -->
  <text x="21" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="950" font-size="24" fill="#0C1D3B" text-anchor="middle">K</text>
  <text x="43" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="950" font-size="24" fill="#E52535" text-anchor="middle">E</text>

  <!-- ENTERPRISES Red Baseline Bar -->
  <rect x="8" y="44" width="48" height="8" rx="2" fill="#E52535"/>
  <text x="32" y="50.5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="6" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MUNDRA</text>

  <!-- Bottom Arch Trim -->
  <path d="M 4,60 Q 32,56 60,60" stroke="#0C1D3B" stroke-width="1.5" />
</svg>
